version: '3.8'

services:
  # PostgreSQL 16 con PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mapa_electoral_postgres
    environment:
      POSTGRES_DB: mapa_electoral
      POSTGRES_USER: mapa_electoral_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - mapa_electoral
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapa_electoral_user -d mapa_electoral"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: mapa_electoral_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - mapa_electoral
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM 8.3
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mapa_electoral_app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=postgres
      - DB_DATABASE=mapa_electoral
      - DB_USERNAME=mapa_electoral_user
      - DB_PASSWORD=${DB_PASSWORD:-dev_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mapa_electoral

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: mapa_electoral_nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mapa_electoral
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Queue Worker
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mapa_electoral_queue
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=postgres
      - DB_DATABASE=mapa_electoral
      - DB_USERNAME=mapa_electoral_user
      - DB_PASSWORD=${DB_PASSWORD:-dev_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mapa_electoral
    restart: unless-stopped

  # Scheduler (Cron)
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mapa_electoral_scheduler
    working_dir: /var/www/html
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=postgres
      - DB_DATABASE=mapa_electoral
      - DB_USERNAME=mapa_electoral_user
      - DB_PASSWORD=${DB_PASSWORD:-dev_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mapa_electoral
    restart: unless-stopped

  # Frontend Vue 3 (dev server — solo para desarrollo)
  frontend:
    image: node:20-alpine
    container_name: mapa_electoral_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${APP_PORT:-8000}
    depends_on:
      - nginx
    networks:
      - mapa_electoral
    profiles:
      - dev   # Activar solo con: docker-compose --profile dev up

networks:
  mapa_electoral:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
